name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uvx ruff check .

      - name: Run tests
        # Tests mock tkinter and manage sys.path themselves, so no project
        # sync (and no system Tk) is required to run them.
        run: uv run --no-project --with pytest pytest -q

  gui-smoke:
    name: gui-smoke (ubuntu, xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The headless unit suite mocks tkinter; this job runs the REAL RYOSApp on
      # a virtual X display to cover the widget + JobController paths the mocked
      # suite can't reach. System python carries _tkinter (via python3-tk); a
      # venv inherits it and adds tkinterdnd2.
      #
      # pystray/pillow are deliberately NOT installed here. They are hard
      # dependencies for users, but a tray needs a real desktop backend, and
      # pulling one into a headless runner buys flakiness rather than
      # coverage. The consequence is that no CI job exercises the tray with
      # pystray present -- only the absent path, via TestTrayWithoutPystray.
      # Tray changes need a manual check on Windows.
      - name: Install Tk and Xvfb
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-venv xvfb

      - name: Create venv with system Tk and install tkinterdnd2
        run: |
          python3 -m venv .venv-gui
          .venv-gui/bin/python -m pip install --upgrade pip
          .venv-gui/bin/python -m pip install tkinterdnd2

      - name: GUI smoke under Xvfb
        run: xvfb-run -a .venv-gui/bin/python tests/gui_smoke.py

  qt-smoke:
    name: qt-smoke (ubuntu, offscreen)
    runs-on: ubuntu-latest
    env:
      # Qt's offscreen platform: real widgets and layouts, no display. The Qt
      # smoke and the launch smoke both pass on it; checks that need two real
      # screens say they were skipped.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      # Libraries Qt loads even offscreen (fonts, EGL, keyboard).
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Qt smoke
        run: uv run --no-project --with PySide6 python tests/qt_smoke.py

      - name: Launch smoke (the real entry point, throwaway data)
        run: uv run python tests/launch_smoke.py

      - name: Session smoke (a whole working session, throwaway data)
        run: uv run python tests/session_smoke.py

  typecheck:
    name: typecheck (mypy, core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      # Static type-check of the UI-free core modules; scope lives in
      # pyproject's [tool.mypy] (UI and Windows-only startup.py are excluded).
      - name: Type-check core (mypy)
        run: uvx mypy
