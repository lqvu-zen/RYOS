[project]
name = "ryos"
dynamic = ["version"]
description = "RYOS - Run Your Own Scripts"
requires-python = ">=3.10"
# The app runs on Qt (PySide6), which brings its own tray (QSystemTrayIcon)
# and file drops -- so pystray, pillow and tkinterdnd2 are no longer needed.
# The Tk interface (RYOS_UI=tk) still runs without them: ryos/ui guards all
# three and degrades to no tray and no file drop.
dependencies = [
    "PySide6>=6.7,<7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.11"]

[project.scripts]
ryos = "ryos.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "ryos/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["ryos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Only collect the real test module; everything else in tests/ is a runnable
# sample script used as a subprocess fixture, not a test.
python_files = ["test_ryos.py"]

[tool.ruff]
target-version = "py310"
# Skill helper scripts and build artifacts are not part of the shipped package.
extend-exclude = [".claude", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
# Ruff's default rule set (pyflakes + a focused pycodestyle subset). This does
# NOT include E501/line-length, since the codebase predates an 88-col standard.
# E741 (ambiguous names like `l`) is left off as a deliberate style exception.
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# Scope: the UI-free core, the cleanly-typed Tkinter modules, and the design
# system generator. Running `mypy` with no arguments checks exactly the files
# listed here.
#
# Two deliberate exclusions, both verified rather than assumed:
#   * ryos/ui/app.py, dialogs.py, cards.py, theme_editor.py -- heavily
#     widget-driven; Tk's dynamic API yields many false positives. Widening
#     into these is tracked in docs/tech-debt-2026-09-21.md.
#   * ryos/startup.py -- Windows-only (winreg). It passes on Windows but
#     reports 8 `name is not defined` errors under `mypy --platform linux`,
#     which is where the typecheck CI job runs. Check it locally with
#     `mypy ryos/startup.py` if you touch it.
#
# When adding a module here, confirm it is clean on BOTH platforms:
#   uvx mypy --platform linux <file>
files = [
    "ryos/db.py",
    "ryos/interpreter.py",
    "ryos/settings.py",
    "ryos/quickrun.py",
    "ryos/quickrun_index.py",
    "ryos/quickrun_actions.py",
    "ryos/jobs.py",
    "ryos/runner.py",
    "ryos/job_controller.py",
    "ryos/notifications.py",
    "ryos/logger.py",
    "ryos/search.py",
    "ryos/dragdrop.py",
    "ryos/screens.py",
    "ryos/grouping.py",
    "ryos/history.py",
    "ryos/schedule_runner.py",
    "ryos/sections.py",
    "ryos/selection.py",
    "ryos/traypolicy.py",
    "ryos/scheduling.py",
    "ryos/ui/__init__.py",
    "ryos/ui/theme.py",
    "ryos/ui/placement.py",
    "ryos/ui/widgets.py",
    "ryos/ui/pipeline.py",
    "ryos/qtui/__init__.py",
    "ryos/qtui/stylesheet.py",
    "ryos/marquee.py",
    "ryos/cardmenu.py",
    "ryos/cardstyle.py",
    "ryos/configio.py",
    "ryos/scriptform.py",
    "ryos/settings_schema.py",
    "ryos/pipelinesteps.py",
    "ryos/verdict.py",
    "ryos/themeform.py",
    "ryos/outputpanel.py",
    "ryos/scheduleform.py",
    "ryos/themes.py",
    "ryos/tray.py",
    "ryos/single_instance.py",
    "design-system/build.py",
]
