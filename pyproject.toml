[project]
name = "ryos"
dynamic = ["version"]
description = "RYOS - Run Your Own Scripts"
requires-python = ">=3.10"
# The app runs on Qt (PySide6), which brings its own tray (QSystemTrayIcon)
# and file drops -- the one dependency.
dependencies = [
    "PySide6>=6.7,<7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.11"]
# `ryos mcp`: the MCP server for AI agents (docs/plans/agent-support.md).
mcp = ["mcp>=2.3,<3"]

[project.scripts]
ryos = "ryos.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "ryos/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["ryos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Only collect the real test modules; everything else in tests/ is a runnable
# sample script used as a subprocess fixture, not a test.
python_files = ["test_ryos.py", "test_headless.py", "test_cli.py",
                "test_agenttools.py", "test_mcpserver.py"]

[tool.ruff]
target-version = "py310"
# Skill helper scripts and build artifacts are not part of the shipped package.
extend-exclude = [".claude", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
# Ruff's default rule set (pyflakes + a focused pycodestyle subset). This does
# NOT include E501/line-length, since the codebase predates an 88-col standard.
# E741 (ambiguous names like `l`) is left off as a deliberate style exception.
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# Scope: the UI-free core, the toolkit-free part of qtui, and the design
# system generator. Running `mypy` with no arguments checks exactly the files
# listed here.
#
# Deliberate exclusions, both verified rather than assumed:
#   * ryos/qtui/* other than __init__ and stylesheet -- they import PySide6,
#     which the typecheck job does not install; tests/qt_smoke.py covers them.
#   * ryos/startup.py -- Windows-only (winreg). It passes on Windows but
#     reports 8 `name is not defined` errors under `mypy --platform linux`,
#     which is where the typecheck CI job runs. Check it locally with
#     `mypy ryos/startup.py` if you touch it.
#
# When adding a module here, confirm it is clean on BOTH platforms:
#   uvx mypy --platform linux <file>
files = [
    "ryos/db.py",
    "ryos/interpreter.py",
    "ryos/settings.py",
    "ryos/quickrun.py",
    "ryos/quickrun_index.py",
    "ryos/quickrun_actions.py",
    "ryos/jobs.py",
    "ryos/runner.py",
    "ryos/job_controller.py",
    "ryos/jobhost.py",
    "ryos/headless.py",
    "ryos/cli.py",
    "ryos/manage.py",
    "ryos/agenttools.py",
    "ryos/mcpserver.py",
    "ryos/notifications.py",
    "ryos/logger.py",
    "ryos/search.py",
    "ryos/dragdrop.py",
    "ryos/screens.py",
    "ryos/grouping.py",
    "ryos/history.py",
    "ryos/schedule_runner.py",
    "ryos/sections.py",
    "ryos/selection.py",
    "ryos/traypolicy.py",
    "ryos/scheduling.py",
    "ryos/qtui/__init__.py",
    "ryos/qtui/stylesheet.py",
    "ryos/marquee.py",
    "ryos/cardmenu.py",
    "ryos/cardstyle.py",
    "ryos/configio.py",
    "ryos/scriptform.py",
    "ryos/settings_schema.py",
    "ryos/pipelinesteps.py",
    "ryos/verdict.py",
    "ryos/themeform.py",
    "ryos/outputpanel.py",
    "ryos/scheduleform.py",
    "ryos/themes.py",
    "ryos/single_instance.py",
    "ryos/detail.py",
    "ryos/basefolder.py",
    "ryos/activity.py",
    "ryos/bugreport.py",
    "design-system/build.py",
]
