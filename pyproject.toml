[project]
name = "ryos"
dynamic = ["version"]
description = "RYOS - Run Your Own Scripts"
requires-python = ">=3.10"
dependencies = [
    "tkinterdnd2>=0.3.0,<1.0",
    "pystray>=0.19,<1.0",
    "pillow>=10,<12",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.11"]

[project.scripts]
ryos = "ryos.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "ryos/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["ryos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Only collect the real test module; everything else in tests/ is a runnable
# sample script used as a subprocess fixture, not a test.
python_files = ["test_ryos.py"]

[tool.ruff]
target-version = "py310"
# Skill helper scripts and build artifacts are not part of the shipped package.
extend-exclude = [".claude", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
# Ruff's default rule set (pyflakes + a focused pycodestyle subset). This does
# NOT include E501/line-length, since the codebase predates an 88-col standard.
# E741 (ambiguous names like `l`) is left off as a deliberate style exception.
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# Scope: the UI-free core plus the cleanly-typed Tkinter modules. The heavily
# widget-driven UI files (ryos/ui/app.py, dialogs.py, cards.py) are excluded for
# now -- Tk's dynamic API yields many false positives there -- and
# ryos/startup.py is Windows-only (winreg), so it can't be checked on the Linux
# CI runner. Running `mypy` with no arguments checks exactly the files listed
# here; widening into the remaining UI files is tracked as future work.
files = [
    "ryos/db.py",
    "ryos/interpreter.py",
    "ryos/settings.py",
    "ryos/quickrun.py",
    "ryos/jobs.py",
    "ryos/runner.py",
    "ryos/job_controller.py",
    "ryos/notifications.py",
    "ryos/logger.py",
    "ryos/search.py",
    "ryos/dragdrop.py",
    "ryos/screens.py",
    "ryos/grouping.py",
    "ryos/ui/__init__.py",
    "ryos/ui/theme.py",
    "ryos/ui/widgets.py",
    "ryos/ui/pipeline.py",
]
