<!-- @dsCard group="Surfaces" height=200 -->
<style>
  :root { color-scheme: light dark; }
  html, body { margin:0; background:var(--bg); color:var(--name_fg);
    font-family:var(--font-sans); -webkit-font-smoothing:antialiased; }
  .stage { padding:18px; display:flex; flex-direction:column; gap:10px; align-items:flex-start; }
  .stage.row { flex-direction:row; align-items:center; flex-wrap:wrap; gap:8px; }
  .cap { font-size:11px; color:var(--path_fg); letter-spacing:.06em; text-transform:uppercase; }
  /* Tk has no border-radius and no box-shadow: nothing here may add either. */
  * { border-radius:0; box-shadow:none; box-sizing:border-box; }
</style>
<style>
  .card { display:flex; background:var(--card_bg); border:1px solid var(--border);
          width:560px; max-width:100%; align-items:stretch; }
  .card:hover { background:var(--card_hover); }
  .rail { width:5px; flex:none; }
  .body { flex:1; min-width:0; padding:10px 12px; display:flex; flex-direction:column; gap:2px; }
  .namerow { display:flex; align-items:center; gap:6px; }
  .name { font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden;
          text-overflow:clip; color:var(--name_fg); }
  .subrow { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--path_fg); }
  .path { flex:1; min-width:0; overflow:hidden; white-space:nowrap; }
  .badge { font-size:11px; font-weight:700; padding:1px 5px; color:var(--fg_on_dark);
           white-space:nowrap; line-height:1.35; }
  .gutter { display:flex; background:var(--border); gap:1px; flex:none; }
  .ib { width:34px; border:0; cursor:pointer; font-family:inherit; font-size:13px;
        background:var(--btn_neutral_bg); color:var(--btn_neutral_fg); }
  .ib:hover { background:var(--btn_neutral_hover); }
  .ib.run { background:var(--btn_run_bg); color:var(--btn_fg); }
  .ib.run:hover { background:var(--btn_run_hover); }
  .ib.retry { background:var(--error); color:var(--btn_fg); }
  .ib.retry:hover { background:var(--btn_stop_active); }
  .ib.stop { background:var(--btn_stop_idle); color:var(--btn_stop_idle_fg); cursor:default; }
  .ib.stop.armed { background:var(--btn_stop_active); color:var(--fg_on_dark); cursor:pointer; }
  .ib.fav { background:var(--accent_wash); color:var(--accent); }
</style>
<div class="stage">
  <div class="card">
    <div class="rail" style="background:var(--pipe_accent)"></div>
    <div class="body">
      <div class="namerow">
        <span class="badge" style="background:var(--pipe_accent)">3 STEPS</span>
        <span class="name">release-candidate</span>
      </div>
      <div class="subrow">
        <span class="path">build.ps1 → test.py → publish.sh</span>
        <span>&nbsp;·&nbsp; 2026-09-19 17:42</span>
        <span class="badge" style="background:var(--ok)">✓ OK</span>
      </div>
    </div>
    <div class="gutter">
      <button class="ib">▲</button><button class="ib">▼</button>
      <button class="ib fav">★</button><button class="ib">✎</button>
      <button class="ib stop">■</button><button class="ib run">▶</button>
    </div>
  </div>
  <div class="cap">Beside a script — the rail is the whole difference</div>
  <div class="card">
    <div class="rail" style="background:var(--accent)"></div>
    <div class="body">
      <div class="namerow">
        <span class="badge" style="background:var(--tag-shell)">Shell</span>
        <span class="name">publish</span>
      </div>
      <div class="subrow"><span class="path">ci/publish.sh</span></div>
    </div>
    <div class="gutter">
      <button class="ib">▲</button><button class="ib">▼</button>
      <button class="ib">☆</button><button class="ib">✎</button>
      <button class="ib stop">■</button><button class="ib run">▶</button>
    </div>
  </div>
</div>
