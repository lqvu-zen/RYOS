<!-- @dsCard group="Feedback" height=210 -->
<style>
  :root { color-scheme: light dark; }
  html, body { margin:0; background:var(--bg); color:var(--name_fg);
    font-family:var(--font-sans); -webkit-font-smoothing:antialiased; }
  .stage { padding:18px; display:flex; flex-direction:column; gap:10px; align-items:flex-start; }
  .stage.row { flex-direction:row; align-items:center; flex-wrap:wrap; gap:8px; }
  .cap { font-size:11px; color:var(--path_fg); letter-spacing:.06em; text-transform:uppercase; }
  .badge { font-size:11px; font-weight:700; padding:1px 5px; color:var(--fg_on_dark);
           white-space:nowrap; line-height:1.35; display:inline-block; }
  * { border-radius:0; box-shadow:none; box-sizing:border-box; }
</style>
<style></style>
<div class="stage">
  <div class="stage row" style="padding:0">
    <span class="badge" style="background:var(--tag-python)">Python</span>
    <span class="badge" style="background:var(--tag-javascript)">JavaScript</span>
    <span class="badge" style="background:var(--tag-typescript)">TypeScript</span>
    <span class="badge" style="background:var(--tag-ruby)">Ruby</span>
    <span class="badge" style="background:var(--tag-perl)">Perl</span>
    <span class="badge" style="background:var(--tag-php)">PHP</span>
    <span class="badge" style="background:var(--tag-shell)">Shell</span>
  </div>
  <div class="stage row" style="padding:0">
    <span class="badge" style="background:var(--tag-powershell)">PowerShell</span>
    <span class="badge" style="background:var(--tag-batch)">Batch</span>
    <span class="badge" style="background:var(--tag-batch)">CMD</span>
    <span class="badge" style="background:var(--tag-exe)">EXE</span>
    <span class="badge" style="background:var(--tag-visual-studio)">VS</span>
    <span class="badge" style="background:var(--tag-vscode)">VS Code</span>
  </div>
  <div class="cap">Unknown extension — the extension itself</div>
  <div class="stage row" style="padding:0">
    <span class="badge" style="background:var(--tag-unknown)">AWK</span>
    <span class="badge" style="background:var(--tag-unknown)">Script</span>
  </div>
  <div class="cap">State badges share the shape but not the palette</div>
  <div class="stage row" style="padding:0">
    <span class="badge" style="background:var(--accent)">⏱ TEMP PARAM</span>
    <span class="badge" style="background:var(--pipe_accent)">🕒 SCHEDULED</span>
  </div>
</div>
