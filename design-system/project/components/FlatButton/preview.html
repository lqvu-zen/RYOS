<!-- @dsCard group="Actions" height=190 -->
<style>
  :root { color-scheme: light dark; }
  html, body { margin:0; background:var(--bg); color:var(--name_fg);
    font-family:var(--font-sans); -webkit-font-smoothing:antialiased; }
  .stage { padding:18px; display:flex; flex-direction:column; gap:10px; align-items:flex-start; }
  .stage.row { flex-direction:row; align-items:center; flex-wrap:wrap; gap:8px; }
  .cap { font-size:11px; color:var(--path_fg); letter-spacing:.06em; text-transform:uppercase; }
  * { border-radius:0; box-shadow:none; box-sizing:border-box; }
</style>
<style>
  .fb { border:0; cursor:pointer; font-family:inherit; font-size:12px; font-weight:700;
        padding:5px 12px; color:var(--btn_fg); background:var(--accent); line-height:1.35; }
  .fb:hover { background:var(--accent2); }
  .fb.run { background:var(--btn_run_bg); color:var(--btn_run_fg); }
  .fb.run:hover { background:var(--btn_run_hover); }
  .fb.dark { background:var(--btn_dark_bg); } .fb.dark:hover { background:var(--btn_dark_hover); }
  .fb.bolt { background:var(--bolt); color:var(--name_fg); } .fb.bolt:hover { background:var(--bolt_hover); }
</style>
<div class="stage">
  <div class="cap">Create · Run · Options · Quick Run</div>
  <div class="stage row" style="padding:0">
    <button class="fb">+ Script</button>
    <button class="fb">+ Pipeline</button>
    <button class="fb run">▶ Run Selected</button>
    <button class="fb dark">⚙</button>
    <button class="fb bolt">⚡</button>
  </div>
  <div class="cap">Fixed character width keeps a row aligned</div>
  <div class="stage row" style="padding:0">
    <button class="fb" style="width:108px">+ Script</button>
    <button class="fb" style="width:108px">+ Group</button>
    <button class="fb" style="width:108px">+ Pipeline</button>
  </div>
</div>
